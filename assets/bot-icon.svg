<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Two of us hunting for a flat with a giant magnifier. Telegram crops to a circle: keep within ~210 px of the centre. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="300" cy="196" r="92"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- magnifier: handle, lens, rim -->
  <line x1="366" y1="262" x2="420" y2="316" stroke="#5B3A29" stroke-width="30" stroke-linecap="round"/>
  <line x1="366" y1="262" x2="378" y2="274" stroke="#2D3436" stroke-width="34" stroke-linecap="round"/>
  <circle cx="300" cy="196" r="92" fill="#DFF6FF"/>
  <g clip-path="url(#lens)">
    <!-- the dream flat, magnified -->
    <rect x="210" y="246" width="180" height="60" fill="#B8E994"/>
    <path d="M300 128 L356 176 L244 176 Z" fill="#E55039"/>
    <rect x="256" y="176" width="88" height="72" fill="#FFFFFF" stroke="#2D3436" stroke-width="4"/>
    <rect x="270" y="190" width="22" height="22" rx="3" fill="#74B9FF"/>
    <rect x="306" y="206" width="24" height="42" rx="3" fill="#F39C12"/>
    <!-- price tag -->
    <g transform="translate(346 152) rotate(12)">
      <rect x="-19" y="-12" width="38" height="24" rx="6" fill="#2ECC71" stroke="#2D3436" stroke-width="3"/>
      <text x="0" y="7" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#FFFFFF">€</text>
    </g>
    <!-- lens glare -->
    <path d="M238 150 A72 72 0 0 1 280 116" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
  <circle cx="300" cy="196" r="92" fill="none" stroke="#2D3436" stroke-width="16"/>

  <!-- sparkles: found it! -->
  <path d="M410 120 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 Z" fill="#FFFFFF"/>
  <path d="M196 98 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="#FFFFFF"/>

  <!-- me: blue, amazed, a little sweaty -->
  <g>
    <ellipse cx="166" cy="330" rx="74" ry="70" fill="#4A90E2" stroke="#2D3436" stroke-width="6"/>
    <circle cx="144" cy="306" r="19" fill="#FFFFFF" stroke="#2D3436" stroke-width="4"/>
    <circle cx="190" cy="306" r="19" fill="#FFFFFF" stroke="#2D3436" stroke-width="4"/>
    <circle cx="151" cy="299" r="9" fill="#2D3436"/>
    <circle cx="197" cy="299" r="9" fill="#2D3436"/>
    <ellipse cx="168" cy="350" rx="12" ry="15" fill="#2D3436"/>
    <path d="M108 262 C100 276 104 288 114 288 C124 288 126 276 108 262 Z" fill="#9AD0F5" stroke="#2D3436" stroke-width="3"/>
  </g>

  <!-- you: pink, delighted -->
  <g>
    <ellipse cx="266" cy="376" rx="58" ry="54" fill="#FF7EB3" stroke="#2D3436" stroke-width="6"/>
    <circle cx="249" cy="358" r="15" fill="#FFFFFF" stroke="#2D3436" stroke-width="4"/>
    <circle cx="285" cy="358" r="15" fill="#FFFFFF" stroke="#2D3436" stroke-width="4"/>
    <circle cx="255" cy="352" r="7" fill="#2D3436"/>
    <circle cx="291" cy="352" r="7" fill="#2D3436"/>
    <path d="M250 386 Q267 404 284 386" stroke="#2D3436" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="236" cy="382" r="7" fill="#FF4F8B" opacity="0.6"/>
    <circle cx="298" cy="382" r="7" fill="#FF4F8B" opacity="0.6"/>
    <path d="M262 318 q-8 -16 4 -18 q12 -2 6 14" fill="none" stroke="#2D3436" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
