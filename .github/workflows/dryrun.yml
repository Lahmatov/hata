name: dry-run
# Runs the real pipeline with --dry-run (prints the digest to the log, sends nothing).
# Manual only (the ci workflow runs types and tests on every push). Quick by default: no photo backfill and at
# most 20 listing pages per source; set max_detail to 0 for no cap.
on:
  workflow_dispatch:
    inputs:
      max_detail:
        description: 'Listing pages to read per source (0 = no cap)'
        required: false
        default: '20'
concurrency:
  group: dry-run-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/hata.sqlite
          key: hata-dryrun-${{ github.run_id }}
          restore-keys: hata-dryrun-
      - name: Dry run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER || 'hata' }}
          PHOTO_BACKFILL: '0'
        run: |
          max="${{ github.event.inputs.max_detail || '20' }}"
          if [ "$max" = "0" ]; then npx tsx src/main.ts --dry-run; else npx tsx src/main.ts --dry-run --max-detail="$max"; fi
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/hata.sqlite
          key: hata-dryrun-${{ github.run_id }}
