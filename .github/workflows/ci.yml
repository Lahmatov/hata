name: ci
# Fast checks on every push to a work branch and on pull requests: types and tests (~30 s). The full dry run
# (reads the sites at 5-10 s per page) is manual: Actions -> dry-run -> Run workflow.
on:
  push:
    branches: ['claude/**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npx playwright test
