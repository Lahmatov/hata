name: telegram-buttons
# Copies 👍/👎 presses into the database. With the Cloudflare bot worker the buttons are answered there
# instantly and this only syncs; without it, this job polls Telegram (GitHub may delay it).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: hata-state # same as daily-digest: never two jobs on the database at once
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  buttons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore state (SQLite)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data/hata.sqlite
          key: hata-state-${{ github.run_id }}
          restore-keys: hata-state-
      - name: Find the bot worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
            [ -n "$sub" ] && echo "WORKER_URL=https://hata-bot.$sub.workers.dev" >> "$GITHUB_ENV"
          fi
          true
      - name: Apply button presses
        if: steps.restore.outputs.cache-matched-key != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx src/main.ts --process-updates
      - name: Save state
        if: steps.restore.outputs.cache-matched-key != ''
        uses: actions/cache/save@v4
        with:
          path: data/hata.sqlite
          key: hata-state-${{ github.run_id }}
