name: bot-worker
# Deploys the Telegram bot worker to Cloudflare (free plan) and points the bot's webhook at it, so
# 👍/👎 and ⭐ are answered instantly. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/bot-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WRANGLER_SEND_METRICS: "false"
      CF_API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::Cloudflare is not configured yet: skipping (see README, 'Мгновенные кнопки')"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; exit 1; fi
          done
          # User tokens (My Profile) and account tokens (Manage account → Account API tokens) both work.
          curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /dev/null \
            || curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/tokens/verify" > /dev/null \
            || { echo "::error::CLOUDFLARE_API_TOKEN is not valid for this account"; exit 1; }
      - name: KV namespace
        if: steps.check.outputs.skip != '1'
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title=="hata-bot") | .id')
          if [ -z "$id" ]; then
            id=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              -d '{"title":"hata-bot"}' "$CF_API/storage/kv/namespaces" | jq -r '.result.id // empty')
          fi
          [ -n "$id" ] || { echo "::error::could not find or create the KV namespace (token needs Workers KV Storage: Edit)"; exit 1; }
          sed -i "s/__KV_ID__/$id/" worker/wrangler.toml
      - name: workers.dev subdomain
        if: steps.check.outputs.skip != '1'
        id: sub
        run: |
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            sub="hata-${CLOUDFLARE_ACCOUNT_ID:0:8}"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"subdomain\":\"$sub\"}" "$CF_API/workers/subdomain" | jq -c '{success, errors}'
          fi
          echo "url=https://hata-bot.$sub.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.check.outputs.skip != '1'
        working-directory: worker
        env:
          URL: ${{ steps.sub.outputs.url }}
        run: |
          npx --yes wrangler@4 deploy --var "APP_URL:$URL"
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4 secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@4 secret put TELEGRAM_CHAT_ID
      - name: Connect the bot
        if: steps.check.outputs.skip != '1'
        env:
          URL: ${{ steps.sub.outputs.url }}
        run: |
          for i in $(seq 1 12); do curl -sf "$URL/" > /dev/null && break; sleep 10; done
          curl -sf "$URL/" || { echo "::error::worker not reachable at $URL"; exit 1; }
          echo
          secret=$(printf '%s' "$TELEGRAM_BOT_TOKEN:hata-webhook" | sha256sum | cut -c1-40)
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" -H 'Content-Type: application/json' \
            -d "{\"url\":\"$URL/telegram\",\"secret_token\":\"$secret\",\"allowed_updates\":[\"callback_query\",\"message\"]}" | jq -c .
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setMyCommands" -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"app","description":"Свайпы: квартиры карточками"},{"command":"fav","description":"Избранное"},{"command":"help","description":"Как пользоваться"}]}' | jq -c .
          # Menu button next to the input field opens the swipe app (Telegram Mini App).
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setChatMenuButton" -H 'Content-Type: application/json' \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"🏠 Свайпы\",\"web_app\":{\"url\":\"$URL/app\"}}}" | jq -c .
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getWebhookInfo" | jq -c '.result | {url, pending_update_count, last_error_message}'
